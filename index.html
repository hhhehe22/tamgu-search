<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f7f6"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>탐구 검색소</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f6;color:#183330;font-family:system-ui,sans-serif;font-size:18px;line-height:1.65}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:white;border-bottom:1px solid #dce7e3}header strong{font-size:22px}main{max-width:850px;margin:auto;padding:32px 22px}h1{font-size:clamp(30px,5vw,46px);line-height:1.25;margin:12px 0}h2{font-size:24px}p{margin:10px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 20px;min-height:48px;cursor:pointer;background:#146b59;color:white;font-weight:700}button.secondary{background:#e4efeb;color:#205d50}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:14px;border:1px solid #b9cdc7;border-radius:12px;background:white;color:#183330}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e0a737;outline-offset:3px}.panel{background:white;border:1px solid #dce7e3;border-radius:24px;padding:24px;margin:20px 0;box-shadow:0 8px 24px #18333008}.tag{font-size:15px;color:#366d60;font-weight:700}.chips{display:flex;gap:10px;flex-wrap:wrap}.chips button{background:#e5f2ec;color:#175c4d}.search{display:flex;gap:10px}.search input{min-width:0}.search button{flex-shrink:0}#answer{white-space:pre-wrap;overflow-wrap:anywhere;font-size:21px;line-height:1.85}label{display:block;margin:14px 0 5px;font-weight:600}label input[type=checkbox]{width:auto}dialog{border:0;border-radius:24px;width:min(92%,600px);max-height:90vh;overflow:auto;padding:24px;color:inherit}dialog::backdrop{background:#18333088}.muted,footer{color:#526d66;font-size:14px}footer{text-align:center;padding:20px} [hidden]{display:none!important} .error{color:#a43b2d} @media(max-width:480px){main{padding:20px 14px}.panel{padding:18px}header{padding:12px 14px}header strong{font-size:18px}.search button{padding:10px 15px}}
</style></head><body><header><strong>◈ 탐구 검색소</strong><div><button class="secondary" id="teacher">교사 설정</button></div></header><main><section id="join" class="panel"><h1>탐구를 시작해요</h1><label for="code">선생님이 알려 준 수업 코드</label><input id="code" type="password" autocomplete="off"><button id="joinBtn" style="margin-top:14px">입장하기</button><p id="joinMsg" role="status"></p></section><section id="student" hidden><span class="tag">오늘의 탐구 주제</span><h1 id="topic"></h1><p>궁금한 낱말을 검색하거나 아래에서 골라 보세요.</p><div class="panel"><form id="searchForm" class="search"><input id="query" maxlength="60" placeholder="궁금한 낱말" aria-label="검색어" autocomplete="off" required><button id="searchBtn">검색</button></form><p class="muted">추천 검색어</p><div class="chips" id="chips"></div></div><p id="status" role="status" aria-live="polite"></p><section class="panel" id="result" hidden><div class="chips"><button id="read" class="secondary">🔊 읽어 주기</button><button id="stop" class="secondary">읽기 멈춤</button></div><h2 id="resultTitle"></h2><div id="answer"></div><p class="muted" id="sourceCount"></p><p class="muted">AI가 정리한 자료예요. 궁금하거나 이상한 내용은 선생님께 물어보세요.</p><label for="notes">내 조사 기록</label><textarea id="notes" rows="3" placeholder="새롭게 알게 된 내용을 적어 보세요."></textarea></section><button id="refresh" class="secondary">오늘의 주제 새로고침</button></section></main><footer>탐구 검색소 · 교실에서 시작하는 작은 발견</footer><dialog id="admin"><h2>교사 설정</h2><div id="login"><label for="password">교사 비밀번호</label><input id="password" type="password" autocomplete="off"><button id="unlock" style="margin-top:12px">확인</button></div><div id="settings" hidden><label for="editTopic">조사 주제</label><input id="editTopic" maxlength="150"><label for="grade">학년</label><select id="grade"></select><label for="level">읽기 난이도</label><select id="level"><option>쉬움</option><option>보통</option><option>심화</option></select><label for="suggest">추천 검색어 (쉼표로 구분)</label><input id="suggest" maxlength="300"><label><input id="voice" type="checkbox"> 음성 읽기 허용</label><button id="save">저장</button><h3>최근 검색 출처</h3><div id="sources"></div></div><p id="adminMsg" role="status"></p><button id="close" class="secondary">닫기</button></dialog><script src="config.js"></script><script src="app.js"></script></body></html>
